[platformio]
default_envs = usb

[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
  fastled/FastLED
  tzapu/WiFiManager@^2.0.17

[env:usb]

[env:ota]
upload_protocol = espota
upload_port = dragon-light.local
upload_flags =
  --auth=${sysenv.DRAGON_LIGHT_OTA_PASSWORD}
